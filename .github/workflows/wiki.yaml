name: Wiki runtime
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: azure/setup-helm@v4.3.0
      - run: pip install -r runtime/requirements.txt httpx==0.28.1
      - run: npm ci --ignore-scripts
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install Hugo
        env:
          HUGO_VERSION: '0.167.0'
        run: |
          cd /tmp
          curl -fsSL -o "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o checksums.txt "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " hugo_${HUGO_VERSION}_linux-amd64.tar.gz$" checksums.txt | sha256sum --check
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          sudo install hugo /usr/local/bin/hugo
      - run: hugo mod vendor --source runtime-site
      - run: test -f runtime-site/_vendor/modules.txt
      - run: make build check wiki-check PYTHON=python
      - run: helm lint charts/wiki --set bootstrapSecret=wiki-bootstrap
      - run: python scripts/check-wiki-chart.py
      - run: helm template smoke charts/wiki --set bootstrapSecret=wiki-bootstrap --set ingress.enabled=true > /tmp/wiki.yaml
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          push: false
          load: true
          tags: wiki:test
      - run: python scripts/check-runtime-container.py --image wiki:test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-wiki:${{ steps.version.outputs.value }}
      - uses: azure/setup-helm@v4.3.0
      - run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          sed -i "s/tag: \"0.2.0\"/tag: \"${VERSION}\"/" charts/wiki/values.yaml
          helm package charts/wiki --version "$VERSION" --app-version "$VERSION" --destination /tmp/charts
          helm push "/tmp/charts/wiki-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          VERSION: ${{ steps.version.outputs.value }}
