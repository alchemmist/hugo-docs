apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wiki.name" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wiki.labels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/static: {{ include (print $.Template.BasePath "/static.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "wiki.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: wiki
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WIKI_CONFIG
              value: /config/wiki.yaml
            - name: CONTENT_PREFIX
              value: {{ .Values.contentPrefix | quote }}
            - name: PUBLIC_ORIGIN
              value: {{ .Values.publicURL | quote }}
            - name: WIKI_PUBLIC
              value: {{ eq .Values.visibility "public" | quote }}
            - name: WIKI_BOOTSTRAP_SECRET_FILE
              value: /run/secrets/bootstrap/token
            - name: GIT_REPOSITORY
              value: {{ .Values.git.repository | quote }}
            - name: GIT_BRANCH
              value: {{ .Values.git.branch | quote }}
            {{- if .Values.git.sshSecret }}
            - name: GIT_SSH_KEY
              value: /run/secrets/git/id_ed25519
            - name: GIT_KNOWN_HOSTS
              value: /run/secrets/git/known_hosts
            {{- end }}
          volumeMounts:
            {{- range $path, $content := .Values.staticFiles }}
            - name: static
              mountPath: {{ printf "/opt/wiki/static/%s" $path | quote }}
              subPath: {{ $path | quote }}
              readOnly: true
            {{- end }}
            - name: config
              mountPath: /config
              readOnly: true
            {{- if .Values.siteConfig }}
            - name: config
              mountPath: /opt/wiki/hugo.toml
              subPath: hugo.toml
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /data
            - name: bootstrap
              mountPath: /run/secrets/bootstrap
              readOnly: true
            {{- if .Values.git.sshSecret }}
            - name: git
              mountPath: /run/secrets/git
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.staticFiles }}
        - name: static
          configMap:
            name: {{ include "wiki.name" . | trunc 56 | trimSuffix "-" }}-static
            items:
              {{- range $path, $content := .Values.staticFiles }}
              - key: {{ sha256sum $path }}
                path: {{ $path | quote }}
              {{- end }}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "wiki.name" . }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "wiki.name" .) .Values.persistence.existingClaim }}
        - name: bootstrap
          secret:
            secretName: {{ required "Set bootstrapSecret to a Secret containing the token key" .Values.bootstrapSecret }}
            defaultMode: 0440
        {{- if .Values.git.sshSecret }}
        - name: git
          secret:
            secretName: {{ .Values.git.sshSecret }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
