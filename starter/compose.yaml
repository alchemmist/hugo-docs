services:
  docs:
    build:
      context: .
    ports:
      - "127.0.0.1:${DOCS_PORT:-1320}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
